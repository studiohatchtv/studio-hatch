*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:#0A0B10;font-family:'DM Sans',sans-serif}
.app{width:100%;max-width:480px;height:100vh;height:100dvh;margin:0 auto;display:flex;flex-direction:column;background:#0A0B10;color:#F4F5F8;position:relative;overflow:hidden}
@media(max-width:480px){.app{max-width:100%}}
.screens{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0;-webkit-overflow-scrolling:touch}
.nav{height:60px;flex-shrink:0;background:#13151C;border-top:.5px solid #23252E;display:flex;align-items:center;justify-content:space-around;z-index:100}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;background:none;border:none;cursor:pointer}
.nav-lbl{font-size:9px;letter-spacing:.08em;text-transform:uppercase;font-weight:500}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:500}
.pill-gold{background:rgba(79,139,255,.13);border:.5px solid #2E4D8C;color:#A8C5FF}
.pill-muted{background:rgba(35,37,46,.13);border:.5px solid #33363F;color:#6E727E}
.card{background:#13151C;border:.5px solid #23252E;border-radius:12px;overflow:hidden}
.sec-title{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#6E727E;font-weight:500;margin-bottom:16px}
.inp{width:100%;padding:12px 16px;background:#0A0B10;border:.5px solid #33363F;border-radius:10px;color:#F4F5F8;font-family:'DM Sans',sans-serif;font-size:14px;outline:none}
.inp:focus{border-color:#2E4D8C}
.inp::placeholder{color:#6E727E}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;display:flex;align-items:flex-end}
.modal-sheet{width:100%;max-width:420px;margin:0 auto;background:#1B1D26;border:.5px solid #23252E;border-radius:20px 20px 0 0;padding:24px 24px 48px}
.range{-webkit-appearance:none;width:100%;height:2px;background:transparent;outline:none}
.range::-webkit-slider-runnable-track{height:2px;background:#23252E;border-radius:1px}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#4F8BFF;margin-top:-6px;cursor:pointer}
@keyframes wave{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.7)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.wbar{width:3px;border-radius:2px;background:#4F8BFF;animation:wave 1.2s ease-in-out infinite;display:inline-block}
.dot{width:6px;height:6px;border-radius:50%;background:#4F8BFF;animation:pulse 2s ease infinite;display:inline-block}
.fade{animation:fadeUp .5s ease forwards}

const TYPE_TO_KEY={exhibition:"exhibitions",event:"events",workshop:"workshops",product:"products",audio:"audio"};
const KEY_TO_TYPE={exhibitions:"exhibition",events:"event",workshops:"workshop",products:"product",audio:"audio"};
const EMPTY_CONTENT={exhibitions:[],events:[],workshops:[],products:[],audio:[],about:""};
async function fetchContent(){
  const grouped={exhibitions:[],events:[],workshops:[],products:[],audio:[],about:""};
  const {data:items}=await db.from("content_items").select("*").order("created_at",{ascending:false});
  (items||[]).forEach(r=>{const k=TYPE_TO_KEY[r.type];if(k)grouped[k].push({id:r.id,...r.data});});
  const {data:st}=await db.from("settings").select("value").eq("key","about").maybeSingle();
  grouped.about=st?.value||"";
  return grouped;
}
// upload a File/Blob to the 'media' bucket, return public URL
async function uploadMedia(fileOrBlob,prefix,ext){
  const path=`${prefix}/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;
  const {error}=await db.storage.from("media").upload(path,fileOrBlob,{upsert:false,contentType:fileOrBlob.type||undefined});
  if(error){console.error("upload",error);return null;}
  return db.storage.from("media").getPublicUrl(path).data.publicUrl;
}

function fmtD(iso,lang){
  const d=new Date(iso+"T00:00:00");
  if(!iso||isNaN(d.getTime()))return{day:iso||"",dayName:"",mon:"",full:iso||""};
  const dn=(lang==="tr"?TR_DAYS:EN_DAYS)[d.getDay()];
  const mn=(lang==="tr"?TR_MON:EN_MON)[d.getMonth()];
  return{day:d.getDate(),dayName:dn,mon:mn,full:`${dn}, ${d.getDate()} ${mn}`};
}
const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;};
function fmtSessions(item){
  if(Array.isArray(item.sessions)&&item.sessions.filter(Boolean).length)return item.sessions.filter(Boolean).join(" · ");
  return item.time||"";
}
function fmtRange(item,lang){
  if(item.startDate&&item.endDate){const a=fmtD(item.startDate,lang),b=fmtD(item.endDate,lang);return `${a.day} ${a.mon} – ${b.day} ${b.mon}`;}
  if(item.startDate)return fmtD(item.startDate,lang).full;
  return item.date||"";
}

function Icon({id,stroke=MU}){
  const s={viewBox:"0 0 24 24",fill:"none",strokeWidth:"1.5",strokeLinecap:"round",strokeLinejoin:"round",width:20,height:20,stroke};
  if(id==="home")return<svg {...s}><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>;
  if(id==="events")return<svg {...s}><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>;
  if(id==="audio")return<svg {...s}><path d="M3 18v-6a9 9 0 0118 0v6"/><path d="M21 19a2 2 0 01-2 2h-1a2 2 0 01-2-2v-3a2 2 0 012-2h3zM3 19a2 2 0 002 2h1a2 2 0 002-2v-3a2 2 0 00-2-2H3z"/></svg>;

  if(id==="admin")return<svg {...s}><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>;

}

function AuthModal({onClose}){
  const {t,lang}=useLang();const {setUser}=useAuth();
  const L=(tr,en)=>lang==="tr"?tr:en;
  const [mode,setMode]=useState("login");
  const [form,setForm]=useState({name:"",email:"",pass:""});
  const [kvkk,setKvkk]=useState(false);
  const [marketing,setMarketing]=useState(false);
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState("");
  const canSubmit=(mode==="reset"?!!form.email:(form.email&&form.pass&&(mode==="login"||kvkk)))&&!busy;
  const sendReset=async()=>{
    if(!form.email){setErr(L("E-posta adresini gir.","Enter your email."));return;}
    setBusy(true);setErr("");
    const {error}=await db.auth.resetPasswordForEmail(form.email.trim(),{redirectTo:window.location.origin+window.location.pathname});
    setBusy(false);
    if(error){setErr(L("Hata: ","Error: ")+(error.message||""));return;}
    setErr(L("✓ Sıfırlama bağlantısı e-postana gönderildi. Bağlantıya tıklayıp yeni şifreni belirle.","✓ Reset link sent to your email. Click it to set a new password."));
  };
  const submit=async()=>{
    if(mode==="reset")return sendReset();
    if(!canSubmit)return;
    setBusy(true);setErr("");
    try{
      if(mode==="login"){
        const {error}=await db.auth.signInWithPassword({email:form.email.trim(),password:form.pass});
        if(error)throw error;
        onClose();
      }else{
        const {data,error}=await db.auth.signUp({email:form.email.trim(),password:form.pass,options:{data:{name:form.name||form.email.split("@")[0],marketing}}});
        if(error)throw error;
        if(data.session){onClose();}
        else{setErr(L("Hesabın oluşturuldu. E-postandaki onay bağlantısına tıkla, sonra giriş yap.","Account created. Click the confirmation link in your email, then log in."));setMode("login");}
      }
    }catch(e){
      setErr(L("Hata: ","Error: ")+(e.message||""));
    }finally{setBusy(false);}
  };
  const socialIn=async(provider)=>{
    if(provider==="apple"){setErr(L("Apple girişi yakında — şimdilik Google veya e-posta ile devam et.","Apple sign-in coming soon — use Google or email for now."));return;}
    setErr("");setBusy(true);
    const {error}=await db.auth.signInWithOAuth({provider:"google",options:{redirectTo:window.location.origin+window.location.pathname}});
    if(error){setErr(L("Hata: ","Error: ")+(error.message||""));setBusy(false);}
  };
  const socialBtn={width:"100%",padding:"12px 14px",borderRadius:10,fontSize:13,fontWeight:500,fontFamily:"'DM Sans',sans-serif",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:10};
  return(
    <div className="modal-bg" onClick={onClose}>
      <div className="modal-sheet" onClick={e=>e.stopPropagation()}>
        <div style={{width:36,height:3,background:"#33363F",borderRadius:2,margin:"0 auto 20px"}}/>
        <div style={{textAlign:"center",marginBottom:18}}><Logo size={36}/></div>
        {mode==="reset"&&<p style={{fontSize:12,color:MU,textAlign:"center",marginBottom:16,lineHeight:1.5}}>{L("Kayıtlı e-postanı gir, sana şifre sıfırlama bağlantısı gönderelim.","Enter your email and we'll send you a password reset link.")}</p>}
        {mode!=="reset"&&<><div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:16}}>
          <button onClick={()=>socialIn("google")} style={{...socialBtn,background:"#FFFFFF",color:"#1F1F1F",border:"none"}}>
            <svg width="17" height="17" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
            {L("Google ile devam et","Continue with Google")}
          </button>
          <button onClick={()=>socialIn("apple")} style={{...socialBtn,background:"#000000",color:"#FFFFFF",border:"none"}}>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="#FFFFFF"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
            {L("Apple ile devam et","Continue with Apple")}
          </button>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:10,margin:"4px 0 14px"}}>
          <div style={{flex:1,height:1,background:"#23252E"}}/>
          <span style={{fontSize:10,letterSpacing:".15em",textTransform:"uppercase",color:MU}}>{L("veya","or")}</span>
          <div style={{flex:1,height:1,background:"#23252E"}}/>
        </div></>}
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          {mode==="register"&&<input className="inp" placeholder={t.name} value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))}/>}
          <input className="inp" placeholder={t.email} type="email" value={form.email} onChange={e=>setForm(f=>({...f,email:e.target.value}))}/>
          {mode!=="reset"&&<input className="inp" placeholder={t.pass} type="password" value={form.pass} onChange={e=>setForm(f=>({...f,pass:e.target.value}))}/>}
        </div>
        {mode==="login"&&<p style={{textAlign:"right",marginTop:8,fontSize:12}}><span onClick={()=>{setMode("reset");setErr("");}} style={{color:GL,cursor:"pointer"}}>{L("Şifremi unuttum?","Forgot password?")}</span></p>}
        {mode==="register"&&<div style={{display:"flex",flexDirection:"column",gap:9,marginTop:14}}>
          <label style={{display:"flex",gap:10,alignItems:"flex-start",cursor:"pointer"}}>
            <input type="checkbox" checked={kvkk} onChange={e=>setKvkk(e.target.checked)} style={{marginTop:2,accentColor:G,cursor:"pointer"}}/>
            <span style={{fontSize:11,color:"#9CA0AD",lineHeight:1.5}}>{L("KVKK Aydınlatma Metni'ni okudum, kişisel verilerimin işlenmesini onaylıyorum.","I have read the Privacy Notice and consent to the processing of my personal data.")} <span style={{color:"#E07070"}}>*</span></span>
          </label>
          <label style={{display:"flex",gap:10,alignItems:"flex-start",cursor:"pointer"}}>
            <input type="checkbox" checked={marketing} onChange={e=>setMarketing(e.target.checked)} style={{marginTop:2,accentColor:G,cursor:"pointer"}}/>
            <span style={{fontSize:11,color:"#9CA0AD",lineHeight:1.5}}>{L("Kampanya, etkinlik ve yeni sergi bildirimleri almak istiyorum.","I want to receive notifications about campaigns, events and new exhibitions.")}</span>
          </label>
        </div>}
        {err&&<p style={{fontSize:12,color:err.startsWith("Hata")||err.startsWith("Error")?"#E07070":"#86EFAC",lineHeight:1.5,marginTop:14,textAlign:"center"}}>{err}</p>}

function Calendar({items,openDetail}){
  const {t,lang}=useLang();
  const now=new Date();
  const [vm,setVm]=useState({y:now.getFullYear(),m:now.getMonth()});
  const [sel,setSel]=useState(null);
  const tIso=todayISO();
  const byDate={};
  items.forEach(it=>{(byDate[it.date]=byDate[it.date]||[]).push(it);});
  const {y,m}=vm;
  const pad=n=>String(n).padStart(2,"0");
  const firstDow=(new Date(y,m,1).getDay()+6)%7;
  const days=new Date(y,m+1,0).getDate();
  const cells=[];
  for(let i=0;i<firstDow;i++)cells.push(null);
  for(let d=1;d<=days;d++)cells.push(d);
  const list=sel?(byDate[sel]||[]):items.filter(it=>it.date>=tIso).sort((a,b)=>a.date<b.date?-1:1).slice(0,10);
  const monName=(lang==="tr"?TR_MONF:EN_MONF)[m];
  const dows=lang==="tr"?["Pzt","Sal","Çar","Per","Cum","Cmt","Paz"]:["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  const shift=d=>{let nm=m+d,ny=y;if(nm<0){nm=11;ny--;}if(nm>11){nm=0;ny++;}setVm({y:ny,m:nm});setSel(null);};
  const navBtn={width:30,height:30,borderRadius:8,background:ON2,border:".5px solid #23252E",color:G,fontSize:16,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"};
  return(
    <div style={{padding:"0 20px"}}>
      <div className="card" style={{padding:"14px 14px 12px",marginBottom:16}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
          <button onClick={()=>shift(-1)} style={navBtn}>‹</button>
          <span style={{fontFamily:"'Bodoni Moda',serif",fontSize:15,color:WH}}>{monName} {y}</span>
          <button onClick={()=>shift(1)} style={navBtn}>›</button>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3,marginBottom:5}}>
          {dows.map(d=><div key={d} style={{textAlign:"center",fontSize:8,color:MU,letterSpacing:".03em"}}>{d}</div>)}
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3}}>
          {cells.map((d,i)=>{
            if(!d)return<div key={i}/>;
            const iso=`${y}-${pad(m+1)}-${pad(d)}`;
            const has=!!byDate[iso],isSel=sel===iso,isToday=iso===tIso;
            return(
              <button key={i} onClick={()=>has&&setSel(isSel?null:iso)} style={{aspectRatio:"1",border:isToday?`.5px solid ${GD}`:".5px solid transparent",borderRadius:7,background:isSel?G:has?`${G}1A`:"transparent",color:isSel?ON:has?GL:WH,fontSize:11,fontWeight:has?600:400,fontFamily:"'DM Sans',sans-serif",cursor:has?"pointer":"default",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
                {d}
                {has&&!isSel&&<span style={{width:3,height:3,borderRadius:"50%",background:G,marginTop:2}}/>}
              </button>
            );
          })}
        </div>
      </div>
      <p className="sec-title">{sel?fmtD(sel,lang).full:(lang==="tr"?"En Yakın Etkinlikler":"Upcoming Events")}</p>
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {list.length===0&&<p style={{fontSize:12,color:MU,padding:"6px 0"}}>{lang==="tr"?"Bu tarihte etkinlik yok.":"No events on this date."}</p>}
        {list.map(e=>{const dd=fmtD(e.date,lang);return(
          <div key={`${e._t}-${e.id}`} className="card" onClick={()=>openDetail(e._t,e)} style={{padding:"13px 16px",display:"flex",alignItems:"center",gap:12,cursor:"pointer"}}>
            <div style={{textAlign:"center",minWidth:38}}>
              <div style={{fontSize:17,fontWeight:600,color:G,fontFamily:"'Bodoni Moda',serif",lineHeight:1}}>{dd.day}</div>
              <div style={{fontSize:9,color:MU,marginTop:2}}>{(dd.mon||"").toUpperCase()}</div>
            </div>
            <div style={{flex:1}}>
              <p style={{fontSize:13,fontWeight:500,color:WH,lineHeight:1.3}}>{e.name}</p>
              <p style={{fontSize:11,color:MU,marginTop:2}}>{fmtSessions(e)&&<span>{fmtSessions(e)} · </span>}{e._t==="workshops"?(lang==="tr"?"Atölye":"Workshop"):(lang==="tr"?"Etkinlik":"Event")}</p>
            </div>
            <span style={{fontSize:10,color:e.spots===0?"#E07070":"#8BB87A"}}>{e.spots===0?t.full:`${e.spots} ${t.spots}`}</span>
          </div>

function AudioScreen({playing,setPlaying,track,setTrack}){
  const {t,lang}=useLang();const {content}=useContent();
  const L=(tr,en)=>lang==="tr"?tr:en;
  const [view,setView]=useState("list");
  const [hp,setHp]=useState(true);
  const [vol,setVol]=useState(75);
  const [cur,setCur]=useState(0);
  const [dur,setDur]=useState(0);
  const audioRef=useRef(null);
  const mainAudio=content.audio.find(a=>a.kind==="main");
  const exhAudios=content.audio.filter(a=>a.kind!=="main");
  useEffect(()=>()=>setPlaying(false),[]);
  useEffect(()=>{const el=audioRef.current;if(el)el.volume=vol/100;},[vol,view,track]);

    audio:[["kind",L("Tür","Type"),"select",true,[["main",L("Ana Gösterim · Immersive","Main Show · Immersive")],["exhibition",L("Sergi Anlatımı · hatch dijital art","Exhibition Narration")]]],["title",L("Ses başlığı","Audio title"),"text",true],["artist",L("Sanatçı / alt başlık — opsiyonel","Artist / subtitle — optional"),"text",false],["desc",L("Açıklama — opsiyonel","Description — optional"),"area",false],["img",L("Kapak görseli — opsiyonel","Cover image — optional"),"image",false],["src",L("Ses dosyası","Audio file"),"audiofile",true],["chapters",L("Bölümler","Chapters"),"chapters",false]],
  };
  const lbl={fontSize:10,color:MU,letterSpacing:".06em",textTransform:"uppercase",marginBottom:6,display:"block"};
  const goldBtn={background:G,border:"none",color:ON,padding:"11px",borderRadius:9,fontSize:12,fontWeight:600,fontFamily:"'DM Sans',sans-serif",cursor:"pointer"};
  const pickImg=file=>{
    if(!file)return;
    setUploading(true);setMsg("");
    const reader=new FileReader();
    reader.onload=ev=>{
      const im=new Image();
      im.onload=()=>{
        const cv=document.createElement("canvas");const max=900;
        let w=im.width,h=im.height;
        if(w>max){h=Math.round(h*max/w);w=max;}
        cv.width=w;cv.height=h;cv.getContext("2d").drawImage(im,0,0,w,h);
        cv.toBlob(async blob=>{
          const url=await uploadMedia(blob,"images","jpg");
          setUploading(false);
          if(url)setForm(f=>({...f,img:url}));
          else setMsg(L("Görsel yüklenemedi (admin girişi gerekli).","Image upload failed (admin login required)."));
        },"image/jpeg",0.82);
      };
      im.src=ev.target.result;
    };
    reader.readAsDataURL(file);
  };
  const pickAudio=async file=>{
    if(!file)return;
    setUploading(true);setMsg("");
    const ext=(file.name.split(".").pop()||"mp3").toLowerCase();
    const url=await uploadMedia(file,"audio",ext);
    setUploading(false);
    if(url)setForm(f=>({...f,src:url,fileName:file.name}));
    else setMsg(L("Ses yüklenemedi (admin girişi gerekli).","Audio upload failed (admin login required)."));
  };
  const submit=async()=>{
    for(const [k,,,req] of fields[ctype]){if(req&&!String(form[k]||"").trim()){setMsg(L("Tüm zorunlu alanları doldurun","Fill all required fields"));return;}}
    const item={...form};
    if(item.spots!==undefined)item.spots=parseInt(item.spots)||0;
    if(item.chapters)item.chapters=item.chapters.filter(c=>(c.title||"").trim());
    if(item.sessions)item.sessions=item.sessions.filter(Boolean);
    setMsg(L("Kaydediliyor…","Saving…"));
    try{
      if(editId){await updateItem(editId,item);setMsg(L("✓ Güncellendi","✓ Updated"));}
      else{await addItem(ctype,item);setMsg(L("✓ Eklendi","✓ Added"));}
      resetForm();
      setTimeout(()=>setMsg(""),2500);
    }catch(e){
      setMsg(L("Kaydedilemedi: ","Save failed: ")+(e.message||""));
    }
  };
  return(
    <div style={{padding:"0 20px",display:"flex",flexDirection:"column",gap:14}}>
      <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
        {types.map(ty=><button key={ty.id} onClick={()=>{setCtype(ty.id);resetForm();setMsg("");}} style={{padding:"6px 12px",borderRadius:7,fontSize:10,fontWeight:500,fontFamily:"'DM Sans',sans-serif",border:`.5px solid ${ctype===ty.id?GD:"#23252E"}`,color:ctype===ty.id?G:MU,background:ctype===ty.id?`${G}12`:ON2,cursor:"pointer"}}>{ty.label}</button>)}
      </div>
      {ctype==="about"?(
        <div className="card" style={{padding:16,display:"flex",flexDirection:"column",gap:10}}>
          <label style={lbl}>{L("Hakkımızda metni","About text")}</label>
          <textarea value={aboutTxt} onChange={e=>setAboutTxt(e.target.value)} rows={6} className="inp" style={{resize:"vertical",fontFamily:"'DM Sans',sans-serif",lineHeight:1.6}}/>
          <button onClick={async()=>{setMsg(L("Kaydediliyor…","Saving…"));try{await updateAbout(aboutTxt);setMsg(L("✓ Kaydedildi","✓ Saved"));setTimeout(()=>setMsg(""),2500);}catch(e){setMsg(L("Kaydedilemedi: ","Save failed: ")+(e.message||""));}}} style={goldBtn}>{L("Kaydet","Save")}</button>
        </div>
      ):(<>
        <div className="card" style={{padding:16,display:"flex",flexDirection:"column",gap:12}}>
          {editId&&<div style={{background:`${G}12`,border:`.5px solid ${GD}`,borderRadius:8,padding:"8px 12px",fontSize:11,color:GL}}>{L("Düzenleme modu — değişiklikleri kaydet veya iptal et.","Editing — save or cancel.")}</div>}
          {fields[ctype].map(([k,label,type,,opts])=>(
            <div key={k}>
              {type!=="bool"&&<label style={lbl}>{label}</label>}
              {type==="bool"
                ?<label style={{display:"flex",gap:10,alignItems:"center",cursor:"pointer",padding:"6px 0"}}>
                  <input type="checkbox" checked={!!form[k]} onChange={e=>setForm(f=>({...f,[k]:e.target.checked}))} style={{width:18,height:18,accentColor:G,cursor:"pointer"}}/>
                  <span style={{fontSize:13,color:WH}}>{label}</span>
                </label>
                :type==="area"
                ?<textarea value={form[k]||""} onChange={e=>setForm(f=>({...f,[k]:e.target.value}))} rows={3} className="inp" style={{resize:"vertical",fontFamily:"'DM Sans',sans-serif",lineHeight:1.5}}/>
                :type==="select"
                ?<div style={{display:"flex",flexDirection:"column",gap:6}}>
                  {opts.map(([ov,ol])=><button key={ov} type="button" onClick={()=>setForm(f=>({...f,[k]:ov}))} style={{padding:"10px 12px",borderRadius:8,fontSize:11,fontFamily:"'DM Sans',sans-serif",textAlign:"left",border:`.5px solid ${form[k]===ov?GD:"#33363F"}`,background:form[k]===ov?`${G}14`:ON,color:form[k]===ov?G:MU,cursor:"pointer"}}>{ol}</button>)}
                </div>
                :type==="chapters"
                ?<div style={{display:"flex",flexDirection:"column",gap:6}}>
                  {(form.chapters||[]).map((ch,ci)=>(
                    <div key={ci} style={{display:"flex",gap:6}}>

                      <button type="button" onClick={()=>setForm(f=>({...f,chapters:(f.chapters||[]).filter((_,x)=>x!==ci)}))} style={{width:34,minWidth:34,borderRadius:8,border:".5px solid #33363F",background:ON,color:"#E07070",fontSize:15,cursor:"pointer"}}>×</button>
                    </div>
                  ))}
                  <button type="button" onClick={()=>setForm(f=>({...f,chapters:[...(f.chapters||[]),{title:"",time:""}]}))} style={{padding:"9px",borderRadius:8,border:".5px dashed #33363F",background:"transparent",color:G,fontSize:11,fontFamily:"'DM Sans',sans-serif",cursor:"pointer"}}>+ {L("Bölüm ekle","Add chapter")}</button>

                :type==="sessions"

                      <button type="button" onClick={()=>setForm(f=>({...f,sessions:(f.sessions||[]).filter((_,x)=>x!==si)}))} style={{width:34,minWidth:34,borderRadius:8,border:".5px solid #33363F",background:ON,color:"#E07070",fontSize:15,cursor:"pointer"}}>×</button>

                  </label>
                </div>

                    {form.src?L("Dosyayı değiştir","Change file"):L("Ses dosyası seç","Choose audio file")}
                    <input type="file" accept="audio/*" onChange={e=>pickAudio(e.target.files[0])} style={{display:"none"}}/>
                  </label>
                </div>
                :<input type={type==="number"?"number":type==="date"?"date":"text"} value={form[k]||""} onChange={e=>setForm(f=>({...f,[k]:e.target.value}))} className="inp" style={type==="date"?{colorScheme:"dark"}:undefined}/>}
            </div>

          <div style={{display:"flex",gap:8}}>
            {editId&&<button onClick={resetForm} style={{...goldBtn,background:"transparent",border:".5px solid #33363F",color:MU}}>{L("İptal","Cancel")}</button>}
            <button onClick={submit} disabled={uploading} style={{...goldBtn,flex:1,opacity:uploading?.6:1,cursor:uploading?"not-allowed":"pointer"}}>{uploading?L("Yükleniyor…","Uploading…"):(editId?L("Güncelle","Update"):L("Ekle","Add"))}</button>
          </div>

        {content[ctype]&&content[ctype].length>0&&<div className="card" style={{padding:"6px 0"}}>
          <p style={{...lbl,padding:"8px 16px 4px"}}>{L("Mevcut içerikler","Existing items")} ({content[ctype].length})</p>
          {content[ctype].map(it=>(
            <div key={it.id} style={{display:"flex",alignItems:"center",gap:8,padding:"10px 16px",borderTop:".5px solid #1A1B22"}}>
              <div style={{flex:1,minWidth:0}}>

                <p style={{fontSize:10,color:MU,marginTop:2,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{[it.status==="live"?L("Yayında","Live"):it.status==="soon"?L("Çok Yakında","Soon"):null,it.startDate?fmtRange(it,lang):(it.date?fmtD(it.date,lang).full:null),fmtSessions(it),it.price].filter(Boolean).join(" · ")}</p>
              </div>
              <button onClick={()=>startEdit(it)} style={{padding:"6px 10px",borderRadius:7,border:`.5px solid ${GD}`,background:"transparent",color:G,fontSize:10,fontFamily:"'DM Sans',sans-serif",cursor:"pointer"}}>{L("Düzenle","Edit")}</button>

            </div>
          ))}
        </div>}
      </>)}
      {msg&&<p style={{fontSize:12,color:msg.startsWith("✓")?"#8BB87A":"#E07070",textAlign:"center"}}>{msg}</p>}
    </div>
  );
}

function DetailPage({type,item,onClose}){
  const {t,lang}=useLang();
  const L=(tr,en)=>lang==="tr"?tr:en;
  const title=item.name||item.title;
  const rows=[];
  if(type==="events"){
    rows.push([L("Tarih","Date"),fmtD(item.date,lang).full]);
    if(fmtSessions(item))rows.push([L("Seans saatleri","Sessions"),fmtSessions(item)]);
    rows.push([L("Kontenjan","Spots"),item.spots===0?L("Dolu","Full"):`${item.spots} ${t.spots}`]);
  }else if(type==="workshops"){
    rows.push([L("Tarih","Date"),fmtD(item.date,lang).full]);
    if(fmtSessions(item))rows.push([L("Seans saatleri","Sessions"),fmtSessions(item)]);
    rows.push([L("Fiyat","Price"),item.price],[L("Seviye","Level"),item.level],[L("Kontenjan","Spots"),`${item.spots} ${t.spots}`]);
  }else if(type==="products"){
    if(item.sub)rows.push([L("Detay","Detail"),item.sub]);
    rows.push([L("Fiyat","Price"),item.price]);
  }else if(type==="exhibitions"){
    if(item.subkind)rows.push([L("Tür","Type"),item.subkind==="immersive"?"studio HATCH Immersive":"studio HATCH Digital Art"]);
    if(item.status)rows.push([L("Durum","Status"),item.status==="live"?L("Yayında","Live"):L("Çok Yakında","Coming Soon")]);
    else if(item.cat)rows.push([L("Etiket","Label"),item.cat]);
    if(fmtRange(item,lang))rows.push([L("Tarih aralığı","Dates"),fmtRange(item,lang)]);
    if(fmtSessions(item))rows.push([L("Seans saatleri","Sessions"),fmtSessions(item)]);
  }
  return(
    <div style={{position:"absolute",inset:0,background:ON,zIndex:300,overflowY:"auto"}}>
      <div style={{position:"relative",height:280,background:item.img?"#000":"linear-gradient(160deg,#083344,#155E75 50%,#0A0B10)"}}>
        {item.img&&<img src={item.img} alt={title} style={{width:"100%",height:"100%",objectFit:"cover"}}/>}
        <div style={{position:"absolute",inset:0,background:"linear-gradient(transparent 55%,rgba(0,0,0,.92))"}}/>
        <button onClick={onClose} style={{position:"absolute",top:48,left:16,width:38,height:38,borderRadius:"50%",background:"rgba(0,0,0,.55)",border:".5px solid #33363F",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}}>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke={WH} strokeWidth="2" strokeLinecap="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        {item.tag&&<span className="pill pill-gold" style={{position:"absolute",bottom:56,left:20}}>{item.tag}</span>}
        <h1 style={{position:"absolute",bottom:18,left:20,right:20,fontFamily:"'Bodoni Moda',serif",fontSize:24,fontWeight:500,color:WH,lineHeight:1.2}}>{title}</h1>
      </div>
      <div style={{padding:"18px 20px 110px"}}>
        <div style={{marginBottom:item.desc?20:8}}>
          {rows.map(([k,v])=>(
            <div key={k} style={{display:"flex",justifyContent:"space-between",padding:"12px 0",borderBottom:".5px solid #181A22"}}>
              <span style={{fontSize:12,color:MU,letterSpacing:".04em"}}>{k}</span>
              <span style={{fontSize:13,color:WH,fontWeight:500}}>{v}</span>
            </div>
          ))}
        </div>
        {item.desc&&<p style={{fontSize:13,color:"#9CA0AD",lineHeight:1.7,marginBottom:item.credits?16:24,whiteSpace:"pre-wrap"}}>{item.desc}</p>}
        {item.credits&&<div style={{marginBottom:24,paddingTop:14,borderTop:".5px solid #1A1B22"}}>
          <p style={{fontSize:10,letterSpacing:".18em",textTransform:"uppercase",color:GL,fontWeight:500,marginBottom:8}}>Credits</p>
          <p style={{fontSize:12,color:"#9CA0AD",lineHeight:1.7,whiteSpace:"pre-wrap"}}>{item.credits}</p>
        </div>}
        {type!=="exhibitions"&&<button onClick={()=>{if(type!=="products"&&item.ticketUrl)window.open(item.ticketUrl,"_blank");}} style={{width:"100%",background:G,border:"none",color:ON,padding:"14px",borderRadius:11,fontSize:13,fontWeight:600,fontFamily:"'DM Sans',sans-serif",cursor:"pointer"}}>{type==="products"?t.add:t.bookNow}</button>}
      </div>
    </div>
  );
}

function NewPasswordModal({onClose}){
  const {lang}=useLang();
  const L=(tr,en)=>lang==="tr"?tr:en;
  const [pass,setPass]=useState("");const [pass2,setPass2]=useState("");
  const [busy,setBusy]=useState(false);const [msg,setMsg]=useState("");
  const submit=async()=>{
    if(pass.length<6){setMsg(L("Şifre en az 6 karakter olmalı.","Password must be at least 6 characters."));return;}
    if(pass!==pass2){setMsg(L("Şifreler eşleşmiyor.","Passwords do not match."));return;}
    setBusy(true);setMsg("");
    const {error}=await db.auth.updateUser({password:pass});
    setBusy(false);
    if(error){setMsg(L("Hata: ","Error: ")+(error.message||""));return;}
    setMsg(L("✓ Şifren güncellendi.","✓ Password updated."));
    setTimeout(onClose,1500);
  };
  return(
    <div className="modal-bg">
      <div className="modal-sheet">
        <div style={{width:36,height:3,background:"#33363F",borderRadius:2,margin:"0 auto 20px"}}/>
        <h2 style={{fontFamily:"'Bodoni Moda',serif",fontSize:20,fontWeight:500,color:WH,textAlign:"center",marginBottom:6}}>{L("Yeni Şifre","New Password")}</h2>
        <p style={{fontSize:12,color:MU,textAlign:"center",marginBottom:18}}>{L("Yeni şifreni belirle.","Set your new password.")}</p>
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          <input className="inp" type="password" placeholder={L("Yeni şifre","New password")} value={pass} onChange={e=>setPass(e.target.value)}/>
          <input className="inp" type="password" placeholder={L("Yeni şifre (tekrar)","New password (again)")} value={pass2} onChange={e=>setPass2(e.target.value)}/>
        </div>
        {msg&&<p style={{fontSize:12,color:msg.startsWith("✓")?"#86EFAC":"#E07070",textAlign:"center",marginTop:14}}>{msg}</p>}
        <button onClick={submit} disabled={busy} style={{width:"100%",marginTop:16,padding:"13px",borderRadius:10,background:G,border:"none",color:ON,fontSize:14,fontWeight:600,fontFamily:"'DM Sans',sans-serif",cursor:"pointer",opacity:busy?.6:1}}>{busy?"…":L("Şifreyi Güncelle","Update Password")}</button>
      </div>
    </div>
  );
}

function App(){
  const [lang,setLang]=useState("tr");
  const [user,setUser]=useState(null);
  const [tab,setTab]=useState("home");
  const [playing,setPlaying]=useState(false);
  const [track,setTrack]=useState(null);
  const [content,setContent]=useState(EMPTY_CONTENT);
  const [detail,setDetail]=useState(null);
  const [recovery,setRecovery]=useState(false);
  const t=T[lang];
  const reload=async()=>{try{setContent(await fetchContent());}catch(e){console.error(e);}};
  useEffect(()=>{reload();},[]);
  useEffect(()=>{
    const apply=async(session)=>{
      if(!session){setUser(null);return;}
      const u=session.user;
      const {data:prof}=await db.from("profiles").select("*").eq("id",u.id).maybeSingle();
      setUser({id:u.id,email:u.email,name:prof?.name||(u.email||"").split("@")[0],isAdmin:!!prof?.is_admin,isGold:true});
    };
    db.auth.getSession().then(({data})=>apply(data.session));
    const {data:sub}=db.auth.onAuthStateChange((event,session)=>{if(event==="PASSWORD_RECOVERY")setRecovery(true);apply(session);});
    return ()=>sub.subscription.unsubscribe();
  },[]);
  const addItem=async(typeKey,item)=>{
    const {id,...data}=item;
    const {error}=await db.from("content_items").insert({type:KEY_TO_TYPE[typeKey],data});
    if(error){console.error(error);throw error;}
    await reload();
  };
  const updateItem=async(id,item)=>{
    const {id:_drop,...data}=item;
    const {error}=await db.from("content_items").update({data}).eq("id",id);
    if(error){console.error(error);throw error;}
    await reload();
  };
  const deleteItem=async(id)=>{
    const {error}=await db.from("content_items").delete().eq("id",id);
    if(error){console.error(error);throw error;}
    await reload();
  };
  const updateAbout=async(txt)=>{
    const {error}=await db.from("settings").upsert({key:"about",value:txt});
    if(error){console.error(error);throw error;}
    setContent(c=>({...c,about:txt}));
  };
  const openDetail=(type,item)=>setDetail({type,item});
  const tabs=[{id:"home",l:t.home},{id:"events",l:t.discover},{id:"audio",l:t.audio},{id:"profile",l:t.profile},...(user?.isAdmin?[{id:"admin",l:t.admin}]:[])];
  return(
    <LC.Provider value={{lang,t,setLang}}>
      <AC.Provider value={{user,setUser}}>
      <CC.Provider value={{content,addItem,updateItem,deleteItem,updateAbout,openDetail}}>
        <div className="app">
          <div className="screens">
            {tab==="home"&&<HomeScreen onNav={setTab}/>}
            {tab==="events"&&<EventsScreen/>}
            {tab==="audio"&&<AudioScreen playing={playing} setPlaying={setPlaying} track={track} setTrack={setTrack}/>}
            {tab==="profile"&&<ProfileScreen/>}
            {tab==="admin"&&<AdminPanel/>}
          </div>
          <nav className="nav">
            {tabs.map(tb=>(
              <button key={tb.id} className="nav-btn" onClick={()=>setTab(tb.id)} style={{background:"none",border:"none",cursor:"pointer"}}>
                {tb.id==="audio"&&playing?(
                  <div style={{display:"flex",alignItems:"flex-end",gap:2,height:20}}>
                    {[...Array(4)].map((_,i)=><span key={i} className="wbar" style={{height:`${8+i*4}px`,animationDelay:`${i*.15}s`,background:tab==="audio"?G:MU}}/>)}
                  </div>
                ):<Icon id={tb.id} stroke={tab===tb.id?G:MU}/>}
                <span className="nav-lbl" style={{color:tab===tb.id?G:MU}}>{tb.l}</span>
              </button>
            ))}
          </nav>
          {detail&&<DetailPage type={detail.type} item={detail.item} onClose={()=>setDetail(null)}/>}
          {recovery&&<NewPasswordModal onClose={()=>setRecovery(false)}/>}
        </div>
      </CC.Provider>
      </AC.Provider>
    </LC.Provider>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
